appId: com.dailynotes.app
productName: 计序
directories:
  output: release
  buildResources: build

# 只打运行时真正需要的东西：
#   out/       —— electron-vite 产物（main / preload / renderer 都在这里，渲染层已 bundle）
#   package.json
# node_modules 由 electron-builder 按 dependencies 自动加入（现在只剩 sql.js；
# antd / @ant-design / @antv / react / xlsx 等已经被 vite 打进 renderer bundle，
# 留在 dependencies 只会让 app.asar 白白多出 200MB）
files:
  - "out/**/*"
  - "package.json"
  - "!**/*.map"
  - "!**/*.zip"
  - "!**/*.7z"
  - "!**/*.blockmap"

win:
  icon: build/icon.ico
  target:
    - nsis
  sign: false
  extraResources:
    - from: build/icon.png
      to: icon.png

mac:
  icon: build/icon.icns
  target:
    - dmg
  extraResources:
    - from: build/icon.png
      to: icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
